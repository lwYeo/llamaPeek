name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/LlamaPeek.Tray -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:InvariantGlobalization=true
          -p:SatelliteResourceLanguages=en -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/llamaPeek.exe -Algorithm SHA256).Hash.ToLower()
          "$h  llamaPeek.exe" | Out-File -Encoding ascii publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: Extract release notes for this version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content RELEASE_NOTES.md
          $start = ($lines | Select-String -Pattern "^# llamaPeek $([regex]::Escape($ver))\s*$" | Select-Object -First 1).LineNumber
          if (-not $start) { Write-Error "No RELEASE_NOTES.md section for $ver"; exit 1 }
          $end = ($lines | Select-Object -Skip $start | Select-String -Pattern "^# " | Select-Object -First 1).LineNumber
          if ($end) { $body = $lines[($start-1)..($start+$end-2)] } else { $body = $lines[($start-1)..($lines.Count-1)] }
          $body | Out-File -Encoding utf8 publish/RELEASE_BODY.md
          Get-Content publish/RELEASE_BODY.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/llamaPeek.exe
            publish/SHA256SUMS.txt
          body_path: publish/RELEASE_BODY.md
          generate_release_notes: true
